<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Management{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-900 text-white shadow-md mb-8">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a class="text-xl font-bold tracking-wide hover:text-gray-300 transition" href="{% url 'student_list' %}">🎓 SMS Dashboard</a>
            
            <div class="flex items-center gap-4">
                {% if user.is_authenticated %}
                    <span class="text-sm text-gray-300">👤 {{ user.username }}</span>
                    <a href="{% url 'student_create' %}" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-3 py-1.5 rounded-lg shadow transition">+ Add Student</a>
                    <a href="{% url 'logout' %}" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-3 py-1.5 rounded-lg shadow transition">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-sm font-semibold hover:text-gray-300">Login</a>
                    <a href="{% url 'register' %}" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-3 py-1.5 rounded-lg shadow transition">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto px-4 pb-12">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-4 rounded-lg shadow-sm flex justify-between items-center {% if message.tags == 'error' %}bg-red-100 border-l-4 border-red-500 text-red-700{% else %}bg-green-100 border-l-4 border-green-500 text-green-700{% endif %}">
                    <span>{{ message }}</span>
                    <button type="button" onclick="this.parentElement.remove()" class="text-gray-500 hover:text-gray-700 font-bold ml-4">&times;</button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
