<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Management{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-900 shadow-lg mb-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div class="flex items-center justify-between h-16">

                <!-- Logo -->
                <a href="{% url 'student_list' %}"
                   class="text-white text-xl font-bold hover:text-blue-400 transition">
                    🎓 SMS Dashboard
                </a>

                <!-- Add Student Button -->
                <a href="{% url 'student_create' %}"
                   class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition duration-200 shadow-md">
                    + Add Student
                </a>

            </div>

        </div>
    </nav>


    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Success / Error Messages -->
        {% if messages %}
            <div class="space-y-3 mb-6">

                {% for message in messages %}

                    <div class="flex items-center justify-between
                                p-4 rounded-lg shadow-sm
                                {% if message.tags == 'success' %}
                                    bg-green-100 text-green-800 border border-green-300
                                {% elif message.tags == 'error' %}
                                    bg-red-100 text-red-800 border border-red-300
                                {% elif message.tags == 'warning' %}
                                    bg-yellow-100 text-yellow-800 border border-yellow-300
                                {% else %}
                                    bg-blue-100 text-blue-800 border border-blue-300
                                {% endif %}"
                         role="alert">

                        <span class="font-medium">
                            {{ message }}
                        </span>

                        <button type="button"
                                onclick="this.parentElement.remove()"
                                class="ml-4 text-lg font-bold opacity-60 hover:opacity-100">
                            &times;
                        </button>

                    </div>

                {% endfor %}

            </div>
        {% endif %}


        <!-- Page Content -->
        {% block content %}

        {% endblock %}

    </main>

</body>
</html>
