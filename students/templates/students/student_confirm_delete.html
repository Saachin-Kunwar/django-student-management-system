{% extends 'students/base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto mt-10">

    <div class="bg-white rounded-xl shadow-lg p-8 text-center border border-gray-200">

        <!-- Warning Icon -->
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 flex items-center justify-center rounded-full bg-red-100">
                <span class="text-3xl">⚠️</span>
            </div>
        </div>

        <!-- Title -->
        <h3 class="text-2xl font-bold text-gray-800 mb-3">
            Delete Student?
        </h3>

        <!-- Message -->
        <p class="text-gray-500 mb-8 leading-relaxed">
            Are you sure you want to delete
            <strong class="text-gray-800">{{ student.name }}</strong>?
            <br>
            This action cannot be undone.
        </p>

        <!-- Buttons -->
        <form method="POST" class="flex justify-center gap-3">
            {% csrf_token %}

            <!-- Delete Button -->
            <button type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-2.5 rounded-lg transition duration-200 shadow-sm">
                🗑️ Yes, Delete
            </button>

            <!-- Cancel Button -->
            <a href="{% url 'student_list' %}"
               class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-6 py-2.5 rounded-lg transition duration-200">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
